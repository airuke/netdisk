name: airuke-netdisk
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: netdisk
      MYSQL_USER: netdisk_app
      MYSQL_PASSWORD: ${NETDISK_DB_PASSWORD:?required}
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ../database/01-core.sql:/docker-entrypoint-initdb.d/01-core.sql:ro
      - ../database/08-10-share-upload.sql:/docker-entrypoint-initdb.d/08-10-share-upload.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1 FROM file_upload_part LIMIT 1"']
      interval: 5s
      timeout: 5s
      retries: 35
  minio:
    build:
      context: .
      dockerfile: minio.Dockerfile
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${NETDISK_MINIO_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${NETDISK_MINIO_SECRET_KEY:?required}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
volumes:
  mysql-data:
  minio-data:
