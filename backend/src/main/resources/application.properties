# =====================================================================
#  Spring Boot 核心配置文件说明 (application.properties)
# =====================================================================
#
# 【1】核心作用
# application.properties 是 Spring Boot 项目的统一配置文件。
# 主要用于配置应用自身，及所依赖组件（如 MySQL、Redis、MyBatis-Plus 等）的运行参数。
# Spring Boot 在启动时会自动读取这些配置，并将其应用到对应的组件中。
#
# 【2】格式说明
# • properties 格式：采用 key=value 的单行赋值形式。
# • yaml / yml 格式：采用树状层级缩进的形式 (application.yml)。
# (注：两者底层作用完全相同，仅仅是书写语法不同)
#
# ---------------------------------------------------------------------
#  【3】多环境配置拆分 (Multi-Environment)
# ---------------------------------------------------------------------
# 实际项目中，为了适配不同机器，配置通常会按环境进行拆分：
#
#   1. application.properties      -> [主配置文件] 存放各环境通用的公共配置
#   2. application-dev.properties  -> [开发环境] 程序员在本地开发时的配置
#   3. application-prod.properties -> [生产环境] 项目部署到正式服务器的配置
#
#  示例：数据库连接在不同环境下的差异
#
#   [本地开发 - dev]
#   spring.datasource.url=jdbc:mysql://localhost:3306/blog
#
#   [服务器部署 - prod]
#   spring.datasource.url=jdbc:mysql://mysql:3306/blog
#
# =====================================================================

spring.application.name=netdisk-backend
server.port=8080
server.address=${NETDISK_BIND_ADDRESS:127.0.0.1}
spring.profiles.default=local

spring.datasource.url=${NETDISK_DB_URL:jdbc:mysql://127.0.0.1:3306/netdisk?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${NETDISK_DB_USER:netdisk_app}
spring.datasource.password=${NETDISK_DB_PASSWORD}

mybatis-plus.configuration.map-underscore-to-camel-case=true
netdisk.jwt.issuer=http://localhost:8080
netdisk.jwt.audience=netdisk-api
netdisk.jwt.secret-base64=${NETDISK_JWT_SECRET}
netdisk.jwt.access-token-ttl-seconds=7200

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=205MB
netdisk.storage.endpoint=${NETDISK_MINIO_ENDPOINT:http://127.0.0.1:9000}
netdisk.storage.access-key=${NETDISK_MINIO_ACCESS_KEY}
netdisk.storage.secret-key=${NETDISK_MINIO_SECRET_KEY}
netdisk.storage.bucket=${NETDISK_MINIO_BUCKET:netdisk}
netdisk.storage.max-file-size=209715200
netdisk.storage.preview-max-size=20971520
netdisk.storage.text-preview-max-size=1048576
netdisk.storage.cleanup-delay-ms=60000

# 分片上传与断点续传（模块 9–10）
netdisk.upload.chunk-size=8388608
netdisk.upload.max-file-size=5368709120
netdisk.upload.session-ttl-hours=72
netdisk.upload.merge-lease-minutes=30
netdisk.upload.cleanup-delay-ms=60000
