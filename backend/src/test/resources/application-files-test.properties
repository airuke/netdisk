spring.datasource.url=jdbc:h2:mem:files_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:files-test-schema.sql
mybatis-plus.configuration.map-underscore-to-camel-case=true
netdisk.jwt.secret-base64=MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
netdisk.jwt.issuer=http://localhost:8080
netdisk.jwt.audience=netdisk-api
netdisk.jwt.access-token-ttl-seconds=7200
netdisk.storage.endpoint=http://127.0.0.1:9000
netdisk.storage.access-key=isolated-test-user
netdisk.storage.secret-key=isolated-test-password
netdisk.storage.bucket=netdisk-test
netdisk.storage.max-file-size=209715200
netdisk.storage.preview-max-size=20971520
netdisk.storage.text-preview-max-size=1048576
netdisk.storage.cleanup-delay-ms=86400000

netdisk.upload.cleanup-delay-ms=86400000
